name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insighthub/backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: insighthub/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.example .env

      - name: Lint
        run: npm run lint

      - name: Verify server imports
        run: node -e "import('./src/app.js').then(() => console.log('ok'))"
        env:
          MONGODB_URI: mongodb+srv://sachinsachitha1321_db_user:<sachinbs13>@cluster0.wbkovxt.mongodb.net/?appName=Cluster0
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insighthub/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: insighthub/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: insighthub/backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t insighthub-backend .
