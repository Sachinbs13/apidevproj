paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: API is running

  /news:
    get:
      tags: [News]
      summary: Paginated news feed
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
      responses:
        '200':
          description: Paginated articles

  /news/compare:
    get:
      tags: [News]
      summary: Compare same story across sources
      parameters:
        - in: query
          name: topic
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Multi-source and single-source articles for topic

  /news/{id}:
    get:
      tags: [News]
      summary: Single article with all source variants
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Article detail
        '404':
          description: Not found

  /search:
    get:
      tags: [Search]
      summary: Full-text search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Search results

  /trending:
    get:
      tags: [Trending]
      summary: Top stories by trending score
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: windowHours
          schema: { type: integer, default: 24 }
      responses:
        '200':
          description: Trending articles

  /sources:
    get:
      tags: [Sources]
      summary: Active sources and health status
      responses:
        '200':
          description: Source list with health summary

  /analytics:
    get:
      tags: [Analytics]
      summary: Dedup rate, category breakdown, source stats
      responses:
        '200':
          description: Analytics dashboard data

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '201':
          description: User created with JWT

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: JWT token

  /preferences:
    post:
      tags: [Auth]
      summary: Save user topic/source preferences
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                topics: { type: array, items: { type: string } }
                sources: { type: array, items: { type: string } }
      responses:
        '200':
          description: Preferences saved

  /auth/api-keys:
    post:
      tags: [API Keys]
      summary: Create an API key for external consumers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: API key created (shown once)
    get:
      tags: [API Keys]
      summary: List your API keys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API key list (prefix only)

  /auth/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Key revoked

x-websocket-events:
  connection:
    auth:
      description: Pass JWT token or API key in Socket.io handshake auth
      example: "{ auth: { token: 'JWT_TOKEN' } }"
  serverToClient:
    - event: live:news_update
      description: New article pushed on ingestion
    - event: live:trending
      description: Trending score update every N minutes
    - event: live:breaking
      description: High-priority article detected
    - event: live:source_status
      description: Source went down or hit rate limit
  clientToServer:
    - event: subscribe:topic
      payload: "{ topic: 'keyword' } or { category: 'tech' }"
    - event: unsubscribe:topic
      payload: "{ topic: 'keyword' } or { category: 'tech' }"
