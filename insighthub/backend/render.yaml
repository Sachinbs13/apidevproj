services:
  - type: web
    name: insighthub-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: NYT_API_KEY
        sync: false
      - key: CURRENTS_API_KEY
        sync: false
      - key: NEWS_COUNTRY
        value: in
      - key: NEWS_LANG
        value: en
      - key: GUARDIAN_SECTION
        value: world/india
      - key: NYT_SECTION
        value: world
      - key: REDIS_ENABLED
        value: 'true'
