services:
  mongodb:
    image: mongo:7
    container_name: insighthub-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: insighthub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insighthub-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/insighthub
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      NYT_API_KEY: ${NYT_API_KEY:-}
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  redis_data:
